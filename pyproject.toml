[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedback-scout"
version = "0.1.0"
description = "A prompt-scoped agent that gathers and synthesizes public customer feedback about any company or product."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
feedback-scout = "feedback_scout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/feedback_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
